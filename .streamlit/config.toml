[theme]
base = "dark"
primaryColor = "#10b981"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#132a24"
textColor = "#e2e8f0"
font = "sans serif"

[server]
maxUploadSize = 10

[client]
# Framework-level suppression of the native deploy/toolbar chrome, so it
# never has to be raced-against by our own injected CSS
# (_hide_streamlit_header() in frontend/custom_sidebar.py) — this is what
# actually eliminates the header flash, since it applies before any
# st.markdown-injected <style> can. The CSS hiding stays in place as a
# defense-in-depth belt-and-braces layer for header sub-elements this
# setting doesn't cover.
toolbarMode = "minimal"
